<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ALPRO R Learning Hub · Algoritma dan Pemrograman</title>
    <meta
      name="description"
      content="Media pendamping belajar Algoritma dan Pemrograman dengan R untuk mahasiswa Statistika angkatan 2026: empat modul, latihan bertingkat, tracing, dan playground."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfd" />

    <!-- Tema dipasang sebelum halaman digambar: mencegah kedipan terang saat
         sistem atau pilihan pengguna memakai mode gelap. -->
    <script>
      (function () {
        var mode = 'auto';
        try {
          var saved = localStorage.getItem('alpro-lh-theme');
          if (saved === 'light' || saved === 'dark' || saved === 'auto') mode = saved;
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode === 'auto' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.setAttribute('data-theme-mode', mode);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#08090c' : '#fbfbfd');
      })();
    </script>
